<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trick or Read！不讀書就搗蛋｜南港分館</title>
<style>
:root{
  --bg:#100d1c;--card:#1c172a;--card2:#241d35;--orange:#ff8a1f;
  --yellow:#ffd447;--purple:#9b6cff;--green:#4ade80;--red:#ff6262;
  --text:#fff8ed;--muted:#c7bfd4;--border:#3b3150;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:
 radial-gradient(circle at 15% 5%,#3b1644 0,transparent 30%),
 radial-gradient(circle at 90% 20%,#40200c 0,transparent 28%),var(--bg);
 color:var(--text);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.container{width:min(1050px,calc(100% - 28px));margin:auto}
.hidden{display:none!important}
header{padding:22px 0 10px;text-align:center}
.logo{font-size:clamp(30px,8vw,58px);font-weight:900;letter-spacing:1px;text-shadow:0 0 18px #ff8a1f66}
.logo span{color:var(--orange)}
.subtitle{color:var(--muted);margin-top:5px}
.hero{padding:24px 0 12px}
.hero-card{background:linear-gradient(145deg,#21162f,#171326);border:1px solid #594369;border-radius:24px;padding:25px;box-shadow:0 15px 50px #0008;position:relative;overflow:hidden}
.hero-card:after{content:"🎃";position:absolute;right:-10px;top:-22px;font-size:105px;opacity:.15;transform:rotate(12deg)}
h1,h2,h3{margin-top:0}
.login{max-width:520px;margin:35px auto}
.input{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--border);background:#0f0c18;color:white;outline:none}
.input:focus{border-color:var(--orange)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:800;transition:.18s;min-height:48px}
.btn:hover{transform:translateY(-2px);filter:brightness(1.08)}
.primary{background:linear-gradient(135deg,var(--orange),#ffb52e);color:#261204}
.yellow{background:var(--yellow);color:#2a2000}
.secondary{background:#332847;color:white;border:1px solid #514163}
.green{background:var(--green);color:#06220e}
.danger{background:#6b2630;color:#fff}
.dashboard{position:sticky;top:0;z-index:20;background:#100d1ce8;backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid #3a3048}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
.stat small{color:var(--muted);display:block}.stat strong{font-size:22px}
.rewards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.reward{font-size:13px;border:1px dashed #6c5b7f;border-radius:12px;padding:10px;color:#eee6f8}
.reward.active{border-color:var(--yellow);box-shadow:0 0 18px #ffd44722}
section{margin:24px 0}
.section-title{display:flex;justify-content:space-between;gap:12px;align-items:end}
.card{background:linear-gradient(145deg,var(--card),#171326);border:1px solid var(--border);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 8px 25px #0004}
.question{border-left:4px solid var(--purple)}
.question.done{border-left-color:var(--green)}
.qhead{display:flex;justify-content:space-between;gap:10px}
.badge{border-radius:999px;padding:5px 9px;font-size:12px;background:#332744;color:#ddd}
.done .badge{background:#164b2b;color:#a7f3c0}
.options{display:grid;gap:9px;margin:15px 0}
.option{display:block;padding:12px;border:1px solid #4a3e5c;border-radius:12px;background:#151120}
.option input{margin-right:8px;accent-color:var(--orange)}
.option.correct{border-color:var(--green);background:#12301f}
.error{color:#ff9696;min-height:22px;font-weight:700}
.task-grid{display:grid;gap:12px}
.task{position:relative}
.task.done{border-color:#3cae67;background:linear-gradient(145deg,#17291e,#151326)}
.task-icon{font-size:32px}
.task-number{color:var(--orange);font-weight:900}
.task p{color:#ddd4e5;line-height:1.55}
.task button{width:100%}
.target{background:#2b1d10;border-color:#8b5c23;box-shadow:inset 0 0 25px #ff8a1f0b}
.target .monster{font-size:42px}
.status{font-weight:800;color:var(--green)}
.notice{padding:15px;border-radius:15px;background:#2d2210;border:1px solid #8b6724;line-height:1.6}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;z-index:100;background:#27202f;border:1px solid #6d5a7d;padding:12px 18px;border-radius:12px;transition:.25s;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.modal{position:fixed;inset:0;background:#090710eF;z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-box{width:min(560px,100%);background:#20182c;border:2px solid var(--orange);border-radius:24px;padding:25px;box-shadow:0 0 80px #ff8a1f33}
.modal-box h2{color:var(--yellow)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.reward-full{min-height:100vh;background:radial-gradient(circle,#37200e,#0d0a14 65%);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.reward-card{width:min(650px,100%);border:2px solid var(--yellow);border-radius:28px;padding:32px 20px;background:#191222;box-shadow:0 0 90px #ff8a1f30}
.reward-emoji{font-size:70px;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px) rotate(3deg)}}
footer{text-align:center;color:#9d94a8;padding:35px 0}
@media(min-width:700px){
 .task-grid{grid-template-columns:1fr 1fr}
 .stats{grid-template-columns:1fr 1fr}
}
@media(max-width:560px){
 .rewards{grid-template-columns:1fr}
 .hero-card{padding:20px}
 .actions{flex-direction:column}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
const QUESTIONS = [
["個人證一次最多可以借幾本書？",["15本","20本","25本"],2],
["熱門書借閱期限是多久？",["7天","14天","30天"],1],
["一個人最多可以同時預約幾本書？",["5本","7本","10本"],1],
["家庭證一次最多可以借幾本書？",["30本","40本","50本"],1],
["還書過期的話可以利用閱讀存摺點數折抵嗎？",["可以","不行"],0],
["借閱證期限是多久？",["3年","5年","6年"],2],
["我手上的書已經被後面的人預約了，我還可以續借嗎？",["可以","不行"],1],
["續借圖書最多可以續借幾次？",["1次","2次","3次"],2],
["非熱門書的話，一次借閱期限是多久？",["14天","30天","60天"],1],
["視聽資料借閱期限是多久？",["7天","14天","30天"],1],
["南港分館的館藏特色是甚麼？",["鐵道文化","原住民文化","綠建築"],1],
["圖書損毀或遺失時該怎麼辦？",["偷偷放回書架","賠償一本新書或賠書的錢","裝作沒事"],1],
["南港分館的飲食類的書在哪一層樓？",["1樓","2樓","3樓"],1],
["可以用手機借書嗎？",["可以","不行"],0],
["視聽資料一次最多可以借幾件？",["3件","5件","7件"],2],
["圖書館可以大聲講話嗎？",["可以","不可以"],1],
["圖書館可以吃東西嗎？",["可以","不可以"],1],
["一星期內有哪兩天圖書館閉館時間較早（星期日與星期一）？",["星期五、六","星期日、一","星期二、三"],1],
["除國定假日外，圖書館固定休館日為？",["每月第1個星期一","每月第1個星期四","每月最後一個星期日"],1],
["辦借書證可以用健保卡作為身分證明嗎？",["可以","不可以"],1]
];

const TASKS = [
["👻","前往［浮動幽靈］巢穴（浮動館藏區），取走 3 本寶書，並利用自助借書機施展借閱魔法。"],
["📚","取得 3 本一般圖書，並利用自助借書機施展借閱魔法。"],
["🎬","前往［大聲公咆哮怪］地盤（視聽資料區），取得 1 片有聲音魔法的視聽資料並利用自助借書機施展借閱魔法。"],
["🎃","前往兒童區［淘氣小南瓜精］或青少年區［黑帽魔法學徒］地盤，取得寶書並利用自助借書機施展借閱魔法。"],
["🔮","前往預約書區，成功解開封印取回你預約的魔法書（成功自助取預約書一次）。"],
["📱","利用手機 APP 借書功能，成功施展借閱魔法借閱 1 本書。"],
["💻","使用網路施展召喚一本無形的電子書（成功搜尋一本電子書）。"],
["🧙‍♂️","知己知彼！使用館藏查詢系統召喚並借閱 1 本與萬聖節、妖怪、怪物或神話相關的魔導書。"]
];

const MONSTERS = [
["000","總類","愛問問題的人面獅身獸"],["100","哲學類","思索者吸血鬼"],["200","宗教類","符咒小殭屍"],
["300","科學類","凶暴暴龍"],["400","應用科學類","瘋狂怪醫"],["500","社會科學類","黑面審判官"],
["600","中國史地類","古墓兵馬俑"],["700","世界史地類","金字塔木乃伊"],["800","語言文學類","辭典千頁眼妖"],
["900","藝術類","歌劇魅影"]
];

const KEY="trickOrRead_Nangang_v1";
let state = JSON.parse(localStorage.getItem(KEY)||"null");

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function init(nickname){
 const qs=shuffle([...Array(20).keys()]).slice(0,5);
 state={nickname:nickname.trim(),questions:qs,answers:{},tasks:Array(9).fill(false),
 monster:MONSTERS[Math.floor(Math.random()*MONSTERS.length)],claimed:false};
 save(); render();
}
function answered(){return Object.values(state.answers).filter(v=>v===true).length}
function taskDone(){return state.tasks.filter(Boolean).length}
function qualified(){return answered()===5 && taskDone()>=1}
function rewardCount(){return answered()===5 ? (taskDone()>=2?2:taskDone()>=1?1:0):0}
function toast(msg){let t=document.querySelector("#toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function render(){
 if(!state){renderLogin();return}
 if(state.claimed){renderClaimed();return}
 const ac=answered(),tc=taskDone(),rc=rewardCount();
 document.getElementById("app").innerHTML=`
 <header><div class="container">
   <div class="logo">🎃 <span>Trick</span> or Read！</div>
   <div class="subtitle">不讀書就搗蛋｜南港分館萬聖節圖書館利用教育活動</div>
 </div></header>
 <div class="dashboard"><div class="container">
   <div class="stats">
    <div class="stat"><small>📖 圖書館守則考驗</small><strong>${ac} / 5 題</strong></div>
    <div class="stat"><small>👻 搗蛋行動任務</small><strong>${tc} 項</strong></div>
   </div>
   <div class="rewards">
    <div class="reward ${ac===5&&tc>=1?'active':''}">🎁 答對 5 題 + 1 項行動<br>➜ 小禮或二手書 1 份</div>
    <div class="reward ${ac===5&&tc>=2?'active':''}">🎁 答對 5 題 + 2 項以上行動<br>➜ 小禮或二手書 2 份（加碼送）</div>
   </div>
 </div></div>
 <main class="container">
   <section class="hero"><div class="hero-card">
    <h2>🧙‍♀️ 魔法學徒 ${esc(state.nickname)}，歡迎入場！</h2>
    <p>熟讀守則、完成任務，收集你的萬聖節魔法獎勵吧！每人限領一次。</p>
    ${ac===5&&tc===0?'<div class="notice">📣 守則考驗已完成！再完成至少 1 項搗蛋行動，就能前往領獎。</div>':''}
    ${ac===5&&tc===1?'<div class="notice">✨ 已達成基本通關！可領取 1 份獎勵；再多完成 1 項行動可再獲得 1 份獎勵喔！<br><br><button class="btn primary" onclick="openReward()">前往領獎 🎁</button></div>':''}
    ${ac===5&&tc>=2?'<div class="notice">🪄 太厲害了！已達成加碼獎勵條件，可領取 2 份獎勵！<br><br><button class="btn yellow" onclick="openReward()">前往領獎 🎁</button></div>':''}
   </div></section>

   <section id="quiz"><div class="section-title"><h2>📜 圖書館守則考驗</h2><span class="badge">必做 5 題</span></div>
   <p style="color:var(--muted)">答錯可以再試一次；答對後該題會鎖定。</p>
   ${state.questions.map((qi,i)=>questionHTML(qi,i)).join("")}</section>

   <section id="tasks"><div class="section-title"><h2>👻 搗蛋行動任務</h2><span class="badge">任選・完成 ${tc} 項</span></div>
   <p style="color:var(--muted)">在館內完成指定行動後，點擊任務並請櫃檯館員核銷。</p>
   <div class="task-grid">
    ${TASKS.map((t,i)=>taskHTML(t,i)).join("")}
    ${monsterTaskHTML()}
   </div></section>
 </main>
 <footer>🎃 Trick or Read！｜南港分館魔法學徒號召令</footer>`;
}
function questionHTML(qi,i){
 const q=QUESTIONS[qi], done=state.answers[i]===true;
 return `<div class="card question ${done?'done':''}">
  <div class="qhead"><h3>第 ${i+1} 題</h3><span class="badge">${done?'✓ 已通過':'待挑戰'}</span></div>
  <div>${esc(q[0])}</div>
  <div class="options">${q[1].map((o,j)=>`<label class="option ${done&&j===q[2]?'correct':''}">
    <input type="radio" name="q${i}" value="${j}" ${done?'disabled':''}> ${String.fromCharCode(65+j)}. ${esc(o)}
  </label>`).join("")}</div>
  ${done?'<div class="status">✓ 答對了！魔法知識 +1</div>':`<div class="error" id="err${i}"></div><button class="btn primary" onclick="answer(${i})">送出答案 ✨</button>`}
 </div>`;
}
function taskHTML(t,i){
 const done=state.tasks[i];
 return `<div class="card task ${done?'done':''}">
   <div class="task-icon">${t[0]}</div><div class="task-number">任務 ${i+1}</div>
   <p>${esc(t[1])}</p>
   ${done?'<div class="status">✓ 已完成並鎖定</div>':'<button class="btn secondary" onclick="openTask('+i+')">完成任務・請館員核銷</button>'}
 </div>`;
}
function monsterTaskHTML(){
 const [code,name,monster]=state.monster,done=state.tasks[8];
 return `<div class="card task target ${done?'done':''}">
  <div class="monster">👹</div><div class="task-number">任務 9｜專屬魔物指派</div>
  <h3>🎯 ${code} ${esc(name)}｜${esc(monster)}</h3>
  <p>前往【${code} ${esc(name)}】尋找「${esc(monster)}」的地盤，取得 1 本該類寶書並利用自助借書機施展借閱魔法！</p>
  ${done?'<div class="status">✓ 已完成並鎖定</div>':'<button class="btn secondary" onclick="openTask(8)">完成任務・請館員核銷</button>'}
 </div>`;
}
function renderLogin(){
 document.getElementById("app").innerHTML=`<header><div class="container">
 <div class="logo">🎃 <span>Trick</span> or Read！</div><div class="subtitle">不讀書就搗蛋｜南港分館</div></div></header>
 <main class="container login"><div class="hero-card">
 <h2>🧙 魔法學徒號召令</h2>
 <p>萬聖節來臨！熟讀《圖書館守則》、挑戰圖書館利用任務，完成後即可獲得限定小禮或二手魔法書。</p>
 <label>請輸入你的暱稱</label><br><br>
 <input id="nickname" class="input" maxlength="20" placeholder="例如：小南瓜">
 <br><br><button class="btn primary" style="width:100%" onclick="start()">開始魔法試煉 🪄</button>
 <p style="font-size:13px;color:var(--muted);margin-bottom:0">※ 系統會在本裝置保存你的挑戰進度。每人限領一次。</p>
 </div></main>`;
}
function start(){const n=document.getElementById("nickname").value;if(!n.trim()){toast("請先輸入暱稱喔！");return}init(n)}
function answer(i){
 const el=document.querySelector(`input[name="q${i}"]:checked`),err=document.getElementById("err"+i);
 if(!el){err.textContent="請先選擇一個答案！";return}
 const correct=Number(el.value)===QUESTIONS[state.questions[i]][2];
 if(correct){state.answers[i]=true;save();render();document.getElementById("quiz").scrollIntoView({behavior:"smooth"})}
 else err.textContent="答案不對喔，再試一次！👻";
}
function openTask(i){
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="taskModal">
 <div class="modal-box"><h2>🧾 任務核銷</h2>
 <p>請向櫃檯館員出示借閱憑證或實體任務結果，由館員輸入通關密碼。</p>
 <input id="taskCode" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="請輸入通關密碼">
 <p id="taskErr" class="error"></p>
 <div class="actions"><button class="btn secondary" onclick="closeModal()">取消</button><button class="btn primary" onclick="verifyTask(${i})">確認通關</button></div>
 </div></div>`);
}
function verifyTask(i){
 if(document.getElementById("taskCode").value!=="8888"){document.getElementById("taskErr").textContent="通關密碼錯誤，請請館員重新輸入。";return}
 state.tasks[i]=true;save();closeModal();render();toast("✨ 任務完成！恭喜你收服一隻搗蛋怪！");
}
function closeModal(){document.getElementById("taskModal")?.remove()}
function openReward(){
 if(!qualified())return;
 const count=rewardCount();
 document.body.insertAdjacentHTML("beforeend",`<div class="reward-full" id="rewardModal">
  <div class="reward-card"><div class="reward-emoji">🎃</div>
  <h1>${count===2?'太厲害了！你是特級魔法師！':'恭喜完成萬聖節挑戰！'}</h1>
  <p style="font-size:18px;line-height:1.8">${count===2?'請出示此畫面給櫃檯館員領取【精美小禮或二手書 共 2 份】！':'請出示此畫面給櫃檯館員領取【精美小禮 1 份或二手書 1 本】！'}</p>
  <p style="color:#bbb">🎁 本次可領取：${count} 份獎勵</p>
  <button class="btn yellow" style="width:100%;margin-top:20px" onclick="claimReward()">館員確認發放禮物</button>
  <button class="btn secondary" style="width:100%;margin-top:10px" onclick="document.getElementById('rewardModal').remove()">返回任務</button>
 </div></div>`);
}
function claimReward(){
 document.getElementById("rewardModal")?.remove();
 document.body.insertAdjacentHTML("beforeend",`<div class="modal" id="claimModal"><div class="modal-box">
 <h2>🔐 館員核銷</h2><p>請館員輸入通關密碼 8888，完成現場領獎核銷。</p>
 <input id="claimCode" class="input" type="password" inputmode="numeric" maxlength="4" placeholder="通關密碼">
 <p id="claimErr" class="error"></p><button class="btn primary" style="width:100%;margin-top:12px" onclick="verifyClaim()">完成核銷</button>
 </div></div>`);
}
function verifyClaim(){
 if(document.getElementById("claimCode").value!=="8888"){document.getElementById("claimErr").textContent="密碼錯誤，請由館員重新輸入。";return}
 state.claimed=true;save();document.getElementById("claimModal").remove();render();
}
function renderClaimed(){
 document.getElementById("app").innerHTML=`<div class="reward-full"><div class="reward-card">
 <div class="reward-emoji">🎉</div><h1>您已完成領獎！</h1>
 <p style="font-size:19px;line-height:1.9">您已於現場完成領獎，感謝參與南港分館萬聖節活動！</p>
 <p style="color:#aaa">此帳號已永久鎖定，無法重複領取或重置。</p>
 </div></div>`;
}
render();
</script>
</body>
</html>
